name: CPU tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install "$(ls dist/*.whl)[notebooks,reference,experiments]"
      - run: python -m unittest discover -v
      - run: python "${GITHUB_WORKSPACE}/examples/quickstart.py"
        working-directory: ${{ runner.temp }}
      - run: jupyter nbconvert --to notebook --execute notebooks/BMERA_simulator.ipynb --output-dir "${RUNNER_TEMP}"
